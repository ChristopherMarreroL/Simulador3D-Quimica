; Capa de configuración SOLO para la sonda técnica de render (Fase 1). No afecta al proyecto salvo que se
; arranque con -CustomConfig=Sonda. Pide DX12 con SM6 (si la GPU lo admite) y genera los campos de
; distancia de las mallas que necesita Lumen por software.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
